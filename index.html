body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}

.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.side .spacer{flex:1}

.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}

  '<div class="card"><h3>Destaques <span style="font-weight:400">ótimo estado, aceitam pets, mais perto da praia</span></h3>'+pick.map(x=>'<a class="row" href="#'+DEST.find(d=>d.k===x.dest).id+'/'+x.n+'"><img src="'+x.ph[0]+'" loading="lazy" alt=""><div class="t"><b>'+esc(x.t)+'</b><small>'+esc(x.city)+' · '+dist(x.dist).replace(' da praia','')+'</small></div><div class="val num">'+brl(x.tot/P)+'<small>por pessoa</small></div></a>').join('')+'</div></div>';
 h+='<div class="card" style="margin-top:16px"><h3>Antes de reservar</h3><div class="alert"><b>Cachorros:</b> mesmo nos que aceitam pets, confirmem com o anfitrião o porte dos cachorros e se há taxa extra.</div><div class="alert"><b>Preço:</b> é o total que o Airbnb mostrou em 17/11/2026, com taxas. Nessa época muda rápido, então confiram no link.</div><div class="alert warn"><b>Pet a confirmar:</b> estão separados em cada destino. Só reservem depois que o anfitrião aceitar os 2 cachorros por mensagem.</div></div>';
 $('#main').innerHTML=h; bindSplit(); drawChart();
}
function drawChart(){
 const max=3500; let h=DEST.map(d=>'<div class="crow"><div class="lab">'+(window.innerWidth<=720&&d.sh?d.sh:d.k)+'</div><div class="track"><div class="band" style="left:'+(2000/max*100)+'%;width:'+(1000/max*100)+'%"></div>'+D.filter(x=>x.dest===d.k&&x.pet==='ok').map(x=>'<div class="dot" data-n="'+x.n+'" style="left:'+Math.min(x.tot/P/max*100,100)+'%;background:'+COL[x.cons]+'"></div>').join('')+'</div></div>').join('');
 h+='<div class="axis"><div></div><div class="ticks">'+[0,1000,2000,3000].map(t=>'<span style="left:'+(t/max*100)+'%">'+(t?(t/1000)+' mil':'0')+'</span>').join('')+'</div></div>';
 h+='<div class="legend"><span><i style="background:var(--accentSoft);border-radius:3px"></i>Orçamento R$ 2 a 3 mil</span><span><i style="background:#16a34a"></i>Ótimo/bom estado</span><span><i style="background:#2563eb"></i>Sem avaliações, fotos boas</span><span><i style="background:#94a3b8"></i>Fotos ok/simples</span><span><i style="background:#f59e0b"></i>Atenção</span></div><div class="tip" id="tip"></div>';
 $('#chartIn').innerHTML=h; const tip=$('#tip'), ch=$('#chart');
 ch.querySelectorAll('.dot').forEach(el=>{const x=D[el.dataset.n-1];
  el.onmouseenter=()=>{tip.innerHTML='#'+x.n+' · '+esc(x.t.slice(0,38))+'<br>'+brl(x.tot/P)+' por pessoa'+(x.pet==='ok'?'':' · pet a confirmar');const r=el.getBoundingClientRect(),c=ch.getBoundingClientRect();tip.style.left=Math.max(0,Math.min(r.left-c.left-20,c.width-240))+'px';tip.style.top=(r.top-c.top-48)+'px';tip.style.opacity=1;};
  el.onmouseleave=()=>tip.style.opacity=0;
  el.onclick=()=>{location.hash=DEST.find(d=>d.k===x.dest).id+'/'+x.n;};});
}
/* ---------- DESTINO ---------- */
const FIL=[['beach','Até 500 m da praia'],['good','Bem conservados'],['rooms','3+ quartos'],['pool','Piscina'],['ac','Ar-condicionado'],['house','Só casas'],['budget','Dentro do orçamento']];
function applyF(L,f){return L.filter(x=>(!f.beach||(x.dist!=null&&x.dist<=500))&&(!f.good||good(x))&&(!f.rooms||(+x.q||0)>=3)&&(!f.pool||x.f.some(s=>s.startsWith('piscina')))&&(!f.ac||x.f.includes('ar-cond.'))&&(!f.house||x.type==='Casa')&&(!f.budget||(x.tot/P>=2000&&x.tot/P<=3000)));}
const SORT={rec:(a,b)=>recScore(a)-recScore(b)||(b.r||0)-(a.r||0)||a.tot-b.tot,preco:(a,b)=>a.tot-b.tot,estado:(a,b)=>RANK[a.cons]-RANK[b.cons]||(b.r||0)-(a.r||0),nota:(a,b)=>((b.nr>=3?b.r:0)-(a.nr>=3?a.r:0))||b.nr-a.nr,praia:(a,b)=>(a.dist??9e9)-(b.dist??9e9),quartos:(a,b)=>(+b.q||0)-(+a.q||0)||a.tot-b.tot};
function telaDestino(d, focus){
 const u=UI[d.id], A=ofDest(d.k,'ok'), C=ofDest(d.k,'cf'), base=u.pet==='ok'?A:C;
 const pp=base.map(x=>x.tot/P).sort((a,b)=>a-b);
 const L=applyF(base,u.f).sort(SORT[u.sort]);
 let h='<div class="top"><div><h1>'+d.k+'</h1><p>'+d.s+'</p></div>'+splitTabs()+'</div>';
 h+='<div class="grid g4">'+
  '<div class="card kpi"><h3>Opções nesta aba</h3><div class="v num">'+base.length+'</div><div class="s">'+(u.pet==='ok'?'aceitam 2 pets':'pet a confirmar')+'</div></div>'+
  '<div class="card kpi"><h3>Por pessoa</h3><div class="v num">'+(pp.length?k1(pp[0]):'-')+'</div><div class="s num">'+(pp.length?'até '+k1(pp[pp.length-1])+', dividindo por '+P:'')+'</div></div>'+
  '<div class="card kpi"><h3>Bem conservadas</h3><div class="v num">'+base.filter(good).length+'</div><div class="s">ótimo/bom estado ou fotos boas</div></div>'+
  '<div class="card kpi"><h3>Até 500 m da praia</h3><div class="v num">'+base.filter(x=>x.dist!=null&&x.dist<=500).length+'</div><div class="s">pela distância informada</div></div></div>';
 h+='<div class="toolbar"><div class="tabs" id="pettabs"><button data-v="ok" class="'+(u.pet==='ok'?'on':'')+'">Aceitam 2 pets<span class="c num">'+A.length+'</span></button><button data-v="cf" class="'+(u.pet==='cf'?'on':'')+'">Pet a confirmar<span class="c num">'+C.length+'</span></button></div>'+
  '<select id="sort">'+[['rec','Recomendados'],['preco','Menor preço'],['estado','Melhor estado'],['nota','Melhor nota'],['praia','Mais perto da praia'],['quartos','Mais quartos']].map(([v,l])=>'<option value="'+v+'"'+(u.sort===v?' selected':'')+'>'+l+'</option>').join('')+'</select><span class="count num">Mostrando '+L.length+' de '+base.length+'</span></div>';
 if(u.pet==='cf') h+='<div class="alert warn">Esses imóveis <b>não deixam claro</b> que aceitam 2 cachorros: alguns aceitam só 1 pet, outros não informam nada e alguns se contradizem. Cada card diz qual é o caso. Vale mandar mensagem ao anfitrião antes de considerar.</div>';
 h+='<div class="chips" style="margin-bottom:16px">'+FIL.map(([k,l])=>'<button class="chip'+(u.f[k]?' on':'')+'" data-f="'+k+'">'+l+'</button>').join('')+'</div>';
 h+=L.length?'<div class="cards">'+L.map(card).join('')+'</div>':'<div class="empty">Nenhum imóvel com esses filtros.</div>';
 $('#main').innerHTML=h; bindSplit();
 document.querySelectorAll('#pettabs button').forEach(b=>b.onclick=()=>{u.pet=b.dataset.v;render();});
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{u.f[b.dataset.f]=!u.f[b.dataset.f];render();});
 $('#sort').onchange=e=>{u.sort=e.target.value;render();};
 document.querySelectorAll('.home').forEach(c=>{const s=c.querySelector('.strip');c.querySelector('.arw.p').onclick=()=>s.scrollBy({left:-s.clientWidth,behavior:'smooth'});c.querySelector('.arw.n').onclick=()=>s.scrollBy({left:s.clientWidth,behavior:'smooth'});});
 if(focus){const el=document.getElementById('h'+focus); if(el){setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800);},50);}}
}
function card(x){
 const pp=x.tot/P, st=ST[x.cons], other=P===7?6:7;
 const facts=[x.q!=null?(x.q==='0'?'estúdio':x.q+(x.q==='1'?' quarto':' quartos')):null,x.c?x.c+' camas':null,x.b?x.b+' banh.':null,x.cap?'até '+x.cap+' pessoas':null].filter(Boolean).join(' · ');
 const tags=[];
 if(x.pet==='ok') tags.push('<span class="tag g">Aceita até '+x.pm+' pets</span>'); else tags.push('<span class="tag y">'+PET[x.pet][0]+'</span>');
 tags.push('<span class="tag '+st[1]+'">'+st[0]+'</span>');
 if((+x.c||0)<4) tags.push('<span class="tag y">Poucas camas p/ o grupo</span>');
 x.f.forEach(f=>tags.push('<span class="tag">'+esc(f)+'</span>'));
 const rating=x.nr>=1&&x.r?'<span>★ <b>'+x.r.toLocaleString('pt-BR')+'</b> ('+x.nr+')</span>':'<span>sem avaliações ainda</span>';
 const sub=[x.limp?'<span>Limpeza <b>'+x.limp+'</b></span>':'',x.exat?'<span>Exatidão <b>'+x.exat+'</b></span>':'',x.fav?'<span><b>Preferido dos hóspedes</b></span>':''].join('');
 const warn=x.neg?'<div class="q w">“'+esc(x.neg)+'”<small>Ponto de atenção · '+esc(x.negInfo)+'</small></div>':(x.cons==='atenção'?'<div class="q w">Notas de limpeza ou exatidão abaixo das outras opções<small>Ponto de atenção</small></div>':'');
 const pos=x.pos?'<div class="q">“'+esc(x.pos)+'”<small>Hóspede · '+esc(x.posInfo||'')+'</small></div>':'';
 const petNote=x.pet!=='ok'&&x.petNote?'<div class="q w">'+esc(x.petNote)+'<small>Sobre pets no anúncio</small></div>':'';
 return '<article class="home" id="h'+x.n+'"><div class="ph"><div class="strip">'+x.ph.map((s,i)=>'<img loading="lazy" src="'+s+'" alt="Foto '+(i+1)+'">').join('')+'</div><button class="arw p" aria-label="Foto anterior">‹</button><button class="arw n" aria-label="Próxima foto">›</button><span class="no">#'+x.n+'</span><span class="pc">'+x.ph.length+' fotos</span></div>'+
 '<div class="hb"><div><div class="tt">'+esc(x.t)+'</div><div class="loc">'+x.type+' · '+esc(x.city||x.dest)+'</div></div><div class="facts">'+facts+'</div>'+
 '<div><div class="price"><span class="pp num">'+brl(pp)+'</span><span class="u">por pessoa</span>'+budTag(pp)+'</div><div class="tot num">Total '+brl(x.tot)+' · com '+other+' pessoas: '+brl(x.tot/other)+' cada</div></div>'+
 '<div class="meta num">'+rating+sub+'</div><div class="meta"><span>'+dist(x.dist)+'</span></div>'+
 '<div class="tags">'+tags.join('')+'</div>'+petNote+pos+warn+'<a class="go" href="'+url(x)+'" target="_blank" rel="noopener">Ver no Airbnb</a></div></article>';
}
/* ---------- SOBRE ---------- */
function telaSobre(){
 $('#main').innerHTML='<div class="top"><div><h1>Como pesquisei</h1><p>Pesquisa feita em 17/11/2026 no Airbnb</p></div></div><div class="grid g2 sobre">'+
 '<div class="card"><h3>Busca</h3><ul><li>Imóveis inteiros disponíveis de 28/12 a 04/01, para 7 hóspedes.</li><li>Só entram imóveis com total de até R$ 21 mil (R$ 3 mil por pessoa dividindo por 7).</li><li><b>Floripa:</b> só o norte da ilha, a até ~1 km da praia (Ingleses, Santinho, Canasvieiras, Cachoeira do Bom Jesus, Ponta das Canas, Jurerê e Daniela).</li><li><b>Região dos Lagos:</b> Cabo Frio, Búzios e Arraial do Cabo.</li><li><b>Caiobá:</b> Caiobá e Matinhos (Guaratuba ficou de fora).</li><li>A distância da praia vem do anúncio ou do resumo do próprio Airbnb e é aproximada.</li></ul></div>'+
 '<div class="card"><h3>Pets</h3><ul><li><b>Aceitam 2 pets:</b> a regra da casa no Airbnb permite 2 ou mais animais.</li><li><b>Pet a confirmar:</b> a regra aceita só 1 pet, não informa nada, ou diz que não aceita mas o texto do anúncio fala em pets. Precisa perguntar ao anfitrião.</li><li>Imóveis que dizem claramente que não aceitam pets ficaram de fora.</li></ul></div>'+
 '<div class="card"><h3>Estado de conservação</h3><ul><li><b>Ótimo estado:</b> notas altas de limpeza e exatidão e nenhuma reclamação sobre estado nas 20 avaliações mais recentes.</li><li><b>Bom estado:</b> notas boas, com alguma ressalva pequena.</li><li><b>Atenção ao estado:</b> hóspedes reclamaram de mofo, colchões, itens velhos ou limpeza. O trecho aparece no card.</li><li><b>Sem avaliações:</b> anúncio novo ou com menos de 3 avaliações. Avaliei pelas fotos (fotos boas, ok ou simples).</li></ul></div>'+
 '<div class="card"><h3>Antes de reservar</h3><ul><li>Confirmar porte dos cachorros e taxa de pet com o anfitrião.</li><li>Conferir o preço no link: ele muda rápido nessa época.</li><li>Ver se as camas atendem o grupo (o card avisa quando há menos de 4 camas).</li></ul></div></div>';
}
function render(){const r=rota(); const [p,f]=r.split('/'); renderSide(); const d=DEST.find(x=>x.id===p);
 if(d){ if(f){const x=D[+f-1]; if(x) UI[d.id].pet=x.pet==='ok'?'ok':'cf';} telaDestino(d,f); } else if(p==='sobre') telaSobre(); else telaInicio();
 if(!f) window.scrollTo(0,0);}
window.addEventListener('hashchange',render); window.addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(renderSide,150);});
render();
</script></body></html>
