<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Réveillon 26/27 · Viagem da galera</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--panel2:#f1f4f9;--line:#e3e8ef;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accentSoft:#e8f0fe;--accentInk:#1d4ed8;--green:#15803d;--greenSoft:#e7f6ec;--yellow:#b45309;--yellowSoft:#fdf3e2;--red:#b91c1c;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit}
select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
.num{font-variant-numeric:tabular-nums}
/* sidebar */
.side{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;transition:.15s}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--accentSoft);color:var(--accentInk);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.side .spacer{flex:1}
.side .sep{height:1px;background:var(--line);margin:8px 6px}
.side .cap{font-size:11px;color:var(--muted);padding:10px 12px 4px;letter-spacing:.3px}
/* main */
main{flex:1;padding:28px 34px 60px;max-width:1280px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.3px}.top p{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:6px}
.bar{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:9px;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--accentSoft);color:var(--accentInk);font-weight:600}
.tabs button .c{font-size:11px;opacity:.8;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;padding:6px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.alert{display:block;padding:12px 14px;border-radius:12px;background:var(--panel2);border-left:3px solid var(--accent);margin-bottom:10px;font-size:13px;line-height:1.5}
.alert.warn{border-color:var(--yellow);background:var(--yellowSoft)}
.alert b{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:13px}
/* destinos (início) */
.dest{text-align:left;cursor:pointer;transition:border-color .15s;text-decoration:none;color:inherit;display:block}
.dest:hover{border-color:var(--accent)}
.dest .n{font-size:16px;font-weight:700}.dest .s{color:var(--muted);font-size:12px;margin-top:2px}
.dest .big{font-size:22px;font-weight:700;margin-top:12px;letter-spacing:-.4px}
.dest .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.dest .l b{color:var(--text);font-weight:600}
/* gráfico */
.crow{display:grid;grid-template-columns:130px 1fr;align-items:center;height:44px}
.crow .lab{font-size:13px;font-weight:600}
.track{position:relative;height:30px;border-bottom:1px dashed var(--line)}
.band{position:absolute;top:0;bottom:0;background:var(--accentSoft);border-radius:6px}
.dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;cursor:pointer;transition:transform .12s}
.dot.h{background:#fff!important;border:2px solid var(--muted)}
.dot:hover{transform:scale(1.5);z-index:3}
.axis{display:grid;grid-template-columns:130px 1fr;font-size:11px;color:var(--muted)}
.axis .ticks{position:relative;height:18px}.axis .ticks span{position:absolute;transform:translateX(-50%);top:3px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--text);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
/* destaques */
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer;text-decoration:none}
.row:hover{background:var(--panel2)}
.row img{width:56px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--panel2)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--muted);font-size:12px}
.row .val{font-weight:700;white-space:nowrap;text-align:right}.row .val small{display:block;font-weight:400;color:var(--muted);font-size:11px}
/* cards de imóvel */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.home{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:20px}
.home.flash{outline:3px solid var(--accent)}
.ph{position:relative;aspect-ratio:4/3;background:var(--panel2);overflow:hidden}
.strip{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.arw{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:17px;opacity:0;transition:opacity .15s}
.ph:hover .arw{opacity:1}.arw.p{left:8px}.arw.n{right:8px}
.no{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.95)}
.pc{position:absolute;bottom:8px;right:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:20px}
.hb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.hb .tt{font-weight:650;font-size:15px;line-height:1.3}
.hb .loc{font-size:12.5px;color:var(--muted);margin-top:2px}
.hb .facts{font-size:13px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price .pp{font-size:22px;font-weight:700;letter-spacing:-.5px}
.price .u{font-size:12.5px;color:var(--muted)}
.tot{font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.meta b{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--panel2);color:var(--text)}
.tag.g{background:var(--greenSoft);color:var(--green)}
.tag.y{background:var(--yellowSoft);color:var(--yellow)}
.tag.b{background:var(--accentSoft);color:var(--accentInk)}
.q{font-size:12.5px;line-height:1.45;padding:1px 0 1px 10px;border-left:3px solid var(--green)}
.q.w{border-color:var(--yellow)}
.q small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.go{margin-top:auto;text-align:center;text-decoration:none;font-weight:600;font-size:13.5px;padding:10px;border-radius:12px;background:var(--accent);color:#fff}
.go:hover{filter:brightness(1.08)}
.sobre p,.sobre li{line-height:1.6;color:var(--text);font-size:13.5px}
.sobre ul{padding-left:18px;display:grid;gap:6px}
.sobre h3{color:var(--text);font-size:14px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:720px){
 body{flex-direction:column}
 .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:6px 4px;border-right:none;border-top:1px solid var(--line);z-index:40;justify-content:space-around}
 .brand,.side .spacer,.side .sep,.side .cap,.nav .cnt{display:none}
 .nav{flex-direction:column;gap:3px;padding:7px 6px;font-size:10px;flex:1;text-align:center}
 main{padding:20px 14px 90px}
 .kpi .v{font-size:20px}
 .crow,.axis{grid-template-columns:84px 1fr}.crow .lab{font-size:12px}
}

.hero{position:relative;margin:-22px -14px 18px;height:230px;overflow:hidden;background:#0f172a}
.hero img{width:100%;height:100%;object-fit:cover;object-position:30% 8%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 45%,rgba(15,23,42,.78) 100%)}
.hero .ht{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff}
.hero .ht b{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px}
.hero .ht small{font-size:12px;opacity:.85}
.mhero{display:none}
@media(max-width:720px){.hero{display:none}.mhero{display:block;position:relative;height:150px;margin:-20px -14px 18px;overflow:hidden}.mhero img{width:100%;height:100%;object-fit:cover;object-position:40% 18%}.mhero .ht{position:absolute;left:16px;bottom:12px;z-index:1;color:#fff}.mhero .ht b{display:block;font-size:17px}.mhero .ht small{font-size:12px;opacity:.85}}
</style></head><body>

<main id="main"></main>

 $('#main').innerHTML='<div class="top"><div><h1>Como pesquisei</h1><p>Pesquisa feita em 17/11/2026 no Airbnb</p></div></div><div class="grid g2 sobre">'+
 '<div class="card"><h3>Busca</h3><ul><li>Imóveis inteiros disponíveis de 28/12 a 04/01, buscando para 7 e para 5 hóspedes.</li><li>O botão <b>Grupo</b> (5, 6 ou 7 pessoas) mostra só imóveis que comportam o grupo e divide o total por esse número.</li><li><b>No orçamento:</b> até R$ 3 mil por pessoa. <b>Um pouco acima:</b> de R$ 3 a 4 mil por pessoa, numa tela separada.</li><li><b>Floripa:</b> só o norte da ilha, a até ~1 km da praia (Ingleses, Santinho, Canasvieiras, Cachoeira do Bom Jesus, Ponta das Canas, Jurerê e Daniela).</li><li><b>Região dos Lagos:</b> Cabo Frio, Búzios e Arraial do Cabo. <b>Caiobá:</b> Caiobá e Matinhos (Guaratuba ficou de fora).</li><li>A distância da praia vem do anúncio ou do resumo do próprio Airbnb e é aproximada.</li></ul></div>'+
 '<div class="card"><h3>Pets</h3><ul><li><b>Aceitam 2 pets:</b> a regra da casa no Airbnb permite 2 ou mais animais.</li><li><b>Pet a confirmar:</b> a regra aceita só 1 pet, não informa nada, ou diz que não aceita mas o texto do anúncio fala em pets. Precisa perguntar ao anfitrião.</li><li>Imóveis que dizem claramente que não aceitam pets ficaram de fora.</li></ul></div>'+
 '<div class="card"><h3>Estado de conservação</h3><ul><li><b>Ótimo estado:</b> notas altas de limpeza e exatidão e nenhuma reclamação sobre estado nas avaliações mais recentes.</li><li><b>Bom estado:</b> notas boas, com alguma ressalva pequena.</li><li><b>Atenção ao estado:</b> hóspedes reclamaram de mofo, colchões, itens velhos ou limpeza. O trecho aparece no card.</li><li><b>Sem avaliações · fotos boas/ok/simples:</b> anúncio com menos de 3 avaliações, avaliado pelas fotos.</li><li><b>Sem avaliações ainda:</b> anúncio novo que não teve as fotos avaliadas (a maioria dos "pet a confirmar").</li></ul></div>'+
 '<div class="card"><h3>Antes de reservar</h3><ul><li>Confirmar porte dos cachorros e taxa de pet com o anfitrião.</li><li>Conferir o preço no link: ele muda rápido nessa época e pode variar com o número de hóspedes.</li><li>Ver se as camas atendem o grupo (o card avisa quando parecem poucas).</li></ul></div></div>';
}
function render(){const r=rota(); const [p,f]=r.split('/'); renderSide(); const d=DEST.find(x=>x.id===p);
 if(f){const x=D[+f-1]; if(x){const k=d?d.id:'acima'; UI[k].pet=x.pet==='ok'?'ok':'cf'; if(k==='acima') UI.acima.dest=null;}}
 if(d) telaLista(d.id,d.k,d.s,f); else if(p==='acima') telaLista('acima','Um pouco acima do orçamento','Opções de R$ 3 a 4 mil por pessoa, para avaliar',f); else if(p==='sobre') telaSobre(); else telaInicio();
 if(!f) window.scrollTo(0,0);}
window.addEventListener('hashchange',render); window.addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(renderSide,150);});
render();
</script></body></html>
